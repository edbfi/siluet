<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#111d33">
		<title>Siluet</title>
		<script src="theme.js"></script>
		<link rel="stylesheet" href="shell.css">
		<link rel="stylesheet" href="studios.css">
		<link rel="stylesheet" href="gallery.css">
		<link rel="stylesheet" href="operations.css">
		<link rel="stylesheet" href="onboarding.css">
		<link rel="stylesheet" href="theme.css">
	</head>
	<body>
		<svg class="shell-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
			<symbol id="shell-mark" viewBox="0 0 128 128">
				<rect x="4" y="4" width="120" height="120" rx="25" fill="#f4c461" />
				<path
					fill="#111d33"
					d="M101 25H62c-22 0-35 10-35 25 0 12 7 19 22 23l21 6c5 1 7 3 7 5s-3 4-9 4H43l-14 17h39c21 0 33-10 33-24 0-13-8-21-22-25l-21-6c-5-1-7-3-7-5s3-3 9-3h27z"
				/>
				<path stroke="#f4c461" stroke-width="4" d="m52 82 29-29" />
			</symbol>
			<symbol id="shell-icon-dashboard" viewBox="0 0 24 24">
				<rect x="3.5" y="3.5" width="7" height="7" rx="1" />
				<rect x="13.5" y="3.5" width="7" height="7" rx="1" />
				<rect x="3.5" y="13.5" width="7" height="7" rx="1" />
				<rect x="13.5" y="13.5" width="7" height="7" rx="1" />
			</symbol>
			<symbol id="shell-icon-image" viewBox="0 0 24 24">
				<rect x="3" y="4" width="18" height="16" rx="2" />
				<circle cx="8.5" cy="9" r="1.5" />
				<path d="m4 17 5-4 3 2 4-4 5 5" />
			</symbol>
			<symbol id="shell-icon-video" viewBox="0 0 24 24">
				<rect x="3" y="4" width="18" height="16" rx="2" />
				<path d="m10 8.5 5.5 3.5-5.5 3.5z" />
			</symbol>
			<symbol id="shell-icon-gallery" viewBox="0 0 24 24">
				<rect x="3" y="7" width="15" height="14" rx="2" />
				<path d="M7 3h12a2 2 0 0 1 2 2v12M3 17l4-4 3 2 3-3 5 5" />
			</symbol>
			<symbol id="shell-icon-jobs" viewBox="0 0 24 24">
				<rect x="4" y="3" width="16" height="18" rx="2" />
				<path d="M8 8h1m3 0h4m-8 4h1m3 0h4m-8 4h1m3 0h4" />
			</symbol>
			<symbol id="shell-icon-settings" viewBox="0 0 24 24">
				<path d="M4 6h6m4 0h6M4 12h11m4 0h1M4 18h2m4 0h10" />
				<circle cx="12" cy="6" r="2" />
				<circle cx="17" cy="12" r="2" />
				<circle cx="8" cy="18" r="2" />
			</symbol>
			<symbol id="shell-icon-wallet" viewBox="0 0 24 24">
				<path
					d="M20 8V6a2 2 0 0 0-2-2H6a3 3 0 0 0 0 6h13a2 2 0 0 1 2 2v5a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7m13 8h2"
				/>
			</symbol>
			<symbol id="shell-icon-arrow" viewBox="0 0 24 24">
				<path d="M5 12h14m-5-5 5 5-5 5" />
			</symbol>
			<symbol id="shell-icon-chevron" viewBox="0 0 24 24">
				<path d="m9 6 6 6-6 6" />
			</symbol>
			<symbol id="shell-icon-menu" viewBox="0 0 24 24">
				<path d="M4 6h16M4 12h16M4 18h16" />
			</symbol>
			<symbol id="shell-icon-close" viewBox="0 0 24 24">
				<path d="m6 6 12 12M18 6 6 18" />
			</symbol>
		</svg>

		<a class="shell-skip" href="#workspace-main">Skip to workspace</a>
		<div class="shell-layout">
			<div class="shell-scrim" hidden></div>
			<aside class="shell-sidebar" id="studio-sidebar" aria-label="Studio sidebar">
				<div class="shell-identity">
					<a class="shell-brand" href="#dashboard">
						<svg class="shell-mark" width="40" height="40" aria-hidden="true">
							<use href="#shell-mark" />
						</svg>
						<span>Siluet</span>
					</a>
					<button
						class="shell-menu-control shell-close"
						type="button"
						aria-label="Close navigation"
					>
						<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-close" /></svg>
					</button>
				</div>

				<nav class="shell-nav" aria-label="Studio navigation">
					<a href="#dashboard" data-shell-route="dashboard" aria-current="page">
						<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-dashboard" /></svg
						><span>Dashboard</span>
					</a>
					<a href="#image" data-shell-route="image">
						<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-image" /></svg
						><span>Image Studio</span>
					</a>
					<a href="#video" data-shell-route="video">
						<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-video" /></svg
						><span>Video Studio</span>
					</a>
					<a href="#gallery" data-shell-route="gallery">
						<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-gallery" /></svg
						><span>Gallery</span>
					</a>
					<a href="#jobs" data-shell-route="jobs">
						<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-jobs" /></svg
						><span>Jobs</span>
					</a>
					<a href="#settings" data-shell-route="settings">
						<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-settings" /></svg
						><span>Settings</span>
					</a>
				</nav>

				<button
					class="shell-wallet-trigger shell-wallet-trigger--rail"
					type="button"
					data-wallet-trigger
					aria-haspopup="dialog"
					aria-controls="wallet-dialog"
				>
					<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-wallet" /></svg>
					<span class="shell-wallet-copy">
						<span>Wallets</span>
						<span class="shell-wallet-preview" data-wallet-summary>No saved balance</span>
					</span>
					<svg class="shell-icon shell-wallet-chevron" aria-hidden="true">
						<use href="#shell-icon-chevron" />
					</svg>
				</button>
			</aside>

			<div class="shell-content">
				<header class="shell-topbar">
					<div class="shell-frame shell-topbar-inner">
						<div class="shell-location">
							<button
								class="shell-menu-control shell-open"
								type="button"
								aria-label="Open navigation"
								aria-controls="studio-sidebar"
								aria-expanded="false"
							>
								<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-menu" /></svg>
							</button>
							<svg class="shell-mark shell-mobile-mark" width="28" height="28" aria-hidden="true">
								<use href="#shell-mark" />
							</svg>
							<span class="shell-location-parent">Workspace</span>
							<span class="shell-location-slash" aria-hidden="true">/</span>
							<span class="shell-location-current">Dashboard</span>
						</div>
						<span
							class="shell-simulation"
							title="This prototype uses simulated jobs and wallet balances"
							>Simulation</span
						>
						<button
							class="shell-wallet-trigger shell-wallet-trigger--mobile"
							type="button"
							data-wallet-trigger
							aria-haspopup="dialog"
							aria-controls="wallet-dialog"
						>
							<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-wallet" /></svg>
							<span class="shell-wallet-copy">
								<span>Wallets</span>
								<span class="shell-wallet-preview" data-wallet-summary>No saved balance</span>
							</span>
							<svg class="shell-icon shell-wallet-chevron" aria-hidden="true">
								<use href="#shell-icon-chevron" />
							</svg>
						</button>
					</div>
				</header>

				<main class="shell-frame shell-main" id="workspace-main" tabindex="-1"></main>
			</div>
		</div>

		<dialog class="wallet-dialog" id="wallet-dialog" aria-labelledby="wallet-title">
			<header class="wallet-dialog-header">
				<div>
					<h2 id="wallet-title">Wallets</h2>
					<p>Saved provider balances</p>
				</div>
				<button class="wallet-dialog-close" type="button" aria-label="Close wallets" autofocus>
					<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-close" /></svg>
				</button>
			</header>
			<label class="wallet-search" hidden>
				Search providers
				<input type="search" autocomplete="off">
			</label>
			<!-- biome-ignore lint/a11y/noNoninteractiveTabindex: The scrollable list needs a keyboard focus target. -->
			<section class="wallet-results" aria-label="Provider balances" tabindex="0" hidden>
				<ul class="wallet-providers"></ul>
				<p class="wallet-no-match" role="status"></p>
			</section>
			<div class="wallet-empty" hidden>
				<p>Connect a provider in Settings to see its saved balance here.</p>
				<a href="#settings/providers">Provider settings</a>
			</div>
		</dialog>

		<template id="shell-dashboard">
			<header class="dash-heading">
				<h1>Your studio</h1>
				<p>Start a study, revisit your work, or check on a job.</p>
			</header>

			<section class="dash-hero" aria-labelledby="dash-launch-title">
				<div class="dash-launch">
					<h2 id="dash-launch-title">
						Make something<br class="dash-launch-break">
						new.
					</h2>
					<p>Generate a still or set a scene in motion.</p>
					<div class="dash-launch-actions">
						<a class="dash-button dash-button-primary" href="#image">
							<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-image" /></svg>Image
							Studio
						</a>
						<a class="dash-button dash-button-secondary" href="#video">
							<svg class="shell-icon" aria-hidden="true"><use href="#shell-icon-video" /></svg>Video
							Studio
						</a>
					</div>
				</div>
				<figure class="dash-feature">
					<img
						src="../studio/media/tide-study.webp"
						alt="A lit lantern on a rocky shore under a blue evening sky"
						width="960"
						height="640"
					>
					<figcaption><span>Tide study</span><small>Sample still</small></figcaption>
				</figure>
			</section>

			<div class="dash-sections">
				<section aria-labelledby="dash-work-title">
					<div class="dash-section-heading">
						<h2 id="dash-work-title">Recent work</h2>
						<a class="dash-link" href="#gallery">
							Open gallery<svg class="shell-icon" aria-hidden="true">
								<use href="#shell-icon-arrow" />
							</svg>
						</a>
					</div>
					<div class="dash-work" data-dash-work></div>
				</section>
				<section aria-labelledby="dash-jobs-title">
					<div class="dash-section-heading">
						<h2 id="dash-jobs-title">Job activity</h2>
						<a class="dash-link" href="#jobs">
							All jobs<svg class="shell-icon" aria-hidden="true">
								<use href="#shell-icon-arrow" />
							</svg>
						</a>
					</div>
					<div class="dash-jobs" data-dash-jobs></div>
				</section>
			</div>
		</template>

		<script src="fixtures.js"></script>
		<script src="pricing.generated.js"></script>
		<script src="wallet.generated.js"></script>
		<script src="state.js"></script>
		<script src="models.js"></script>
		<script src="studios.js"></script>
		<script src="gallery.js"></script>
		<script src="operations.js"></script>
		<script src="onboarding.js"></script>
		<script src="shell.js"></script>
	</body>
</html>
