# SPDX-License-Identifier: AGPL-3.0-or-later
# Weekly online drift check for the pinned Poyo.ai catalog, docs index, OpenAPI specs and reviewed
# pages. It only reads anonymous public sources and needs no secret. A failure means a reviewed
# re-pin is due; the app keeps its pinned sources until then. PRs run the offline fixtures with the
# unit tests in ci.yml, never this online job.
name: Catalog drift
on:
  schedule:
    - cron: '13 7 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: catalog-drift
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  drift:
    name: Check catalog drift
    if: >-
      github.repository == 'edbfi/siluet' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: package.json }
      - name: Test the drift check offline
        run: bun test ./scripts/media-catalog/drift.test.ts
      # The mirror goes to a fresh directory under the runner's temporary space, outside the
      # checkout. The report lands in the run summary whether or not it finds drift.
      - name: Compare the pinned sources with the upstream head
        env: { TMPDIR: '${{ runner.temp }}' }
        run: bun scripts/media-catalog/drift.ts | tee -a "$GITHUB_STEP_SUMMARY"
