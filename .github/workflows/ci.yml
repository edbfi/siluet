# SPDX-License-Identifier: AGPL-3.0-or-later
# Include every PR job in ci-ok. Path filters on the workflow leave required checks pending.
# Bun only: a bare bin runs its `#!/usr/bin/env node` with the runner's Node, so scripts run with
# `bun run --bun`, bins with `bunx --bun`, and lifecycle scripts call `bun --bun <bin>` (bun ci
# ignores --bun there, oven-sh/bun#44584).
name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "43 6 * * 2" }]   # weekly audit + main revalidation; minute unique per repo
permissions: {}
# The head SHA keeps a re-run from cancelling a newer head; main runs never cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: package.json }
      - name: Fail on node, npm and npx (Bun only)
        run: |
          mkdir -p "$RUNNER_TEMP/bun-only"
          for tool in node npm npx; do
            printf '#!/bin/sh\necho "::error::%s called; run it under Bun (--bun)" >&2\nexit 97\n' "$tool" > "$RUNNER_TEMP/bun-only/$tool"
            chmod +x "$RUNNER_TEMP/bun-only/$tool"
          done
          echo "$RUNNER_TEMP/bun-only" >> "$GITHUB_PATH"
      - run: bun ci
      # A released migration never changes. Compare against the event's base commit, fetched
      # alone into the shallow checkout (the repository is public, so no credentials are needed).
      - name: Keep released migrations append-only
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE="$PR_BASE" ;;
            push) BASE="$PUSH_BEFORE" ;;
            *) echo "::notice::No base commit for $EVENT; the in-tree migration test still runs."; exit 0 ;;
          esac
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "::notice::This push has no previous commit to compare migrations with."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          bun scripts/db/released-append-only.ts "$BASE"
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with: { extra-args: "--all-files --hook-stage manual" }
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: package.json }
      - name: Fail on node, npm and npx (Bun only)
        run: |
          mkdir -p "$RUNNER_TEMP/bun-only"
          for tool in node npm npx; do
            printf '#!/bin/sh\necho "::error::%s called; run it under Bun (--bun)" >&2\nexit 97\n' "$tool" > "$RUNNER_TEMP/bun-only/$tool"
            chmod +x "$RUNNER_TEMP/bun-only/$tool"
          done
          echo "$RUNNER_TEMP/bun-only" >> "$GITHUB_PATH"
      - run: bun ci
      - run: bun run --bun build
      - run: bunx --bun --no-install playwright install --with-deps chromium firefox
      - run: bun run --bun smoke
      # Playwright keeps a trace and error context for each failed test. They hold fixture data only.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  native-owner:
    strategy:
      fail-fast: false
      matrix: { os: [macos-15] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: package.json }
      - run: bun ci
      - run: bun test --timeout 30000 ./src/lib/server/db ./src/lib/server/services/owner ./src/lib/server/services/gallery ./src/lib/server/services/video-media ./src/routes/settings/security ./scripts/owner-recover.test.ts
      - run: bun run --bun build
      - run: bunx --bun --no-install playwright install chromium firefox webkit
      # Browser-key sessions in all three engines, WebKit's key persistence included.
      - run: bun run --bun smoke tests/browser/authenticator.spec.ts tests/browser/key-persistence.spec.ts tests/browser/tab-sessions.spec.ts tests/browser/owner-restarts.spec.ts tests/browser/cross-port.spec.ts tests/browser/gallery-download.spec.ts --workers=1
      # The first-run journeys tab through links and radios, which macOS WebKit skips without Full
      # Keyboard Access; they run in Chromium and Firefox here, as before in Chromium.
      - if: ${{ !cancelled() }}
        run: bun run --bun smoke tests/browser/studio.spec.ts tests/browser/first-saved-image.spec.ts tests/browser/first-saved-video.spec.ts tests/browser/poyo-first-video.spec.ts --project=chromium --project=firefox --workers=1 --output=test-results/journeys
      # Gallery's note for a clip WebKit plays as sound only, and its control with a clip WebKit
      # decodes. Neither journey uses the keyboard.
      - if: ${{ !cancelled() }}
        run: bun run --bun smoke tests/browser/first-saved-video.spec.ts --project=webkit --grep "Gallery (says when this browser cannot play|plays) a saved clip" --workers=1 --output=test-results/webkit-playability
      # Playwright keeps a trace and error context for each failed test. They hold fixture data only.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-owner-test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  media-cleanup:
    name: Media cleanup (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix: { runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15] }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: { contents: read }
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: package.json }
      - run: bun ci
      - name: Provision the pinned ExifTool for independent inspection
        run: bun scripts/media-cleanup/exiftool.ts >> "$GITHUB_ENV"
      - run: bun test --timeout 60000 ./src/lib/server/services/media-cleanup ./src/lib/server/services/media-staging ./src/lib/server/db/runtime-installation.test.ts ./src/lib/server/db/recovery-lock.test.ts ./src/lib/server/db/media-cleaning.test.ts ./src/lib/server/db/file-attempt.test.ts ./src/lib/server/db/poyo-upload-window.test.ts ./src/lib/server/services/file-edit
      # Gallery's peak-memory budgets on arm64 (D5). x64 runs them in `checks` and macOS in
      # `native-owner`; each run appends its figures to the job summary.
      - name: Measure Gallery's peak memory at its bounds
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: bun test --timeout 60000 ./src/lib/server/services/gallery/budget.test.ts
      - run: bun run --bun build
      - name: Drive staging, shutdown and restart on the built server
        run: bun test --timeout 60000 ./tests/media-cleanup
  ci-ok:
    if: always()
    needs: [checks, smoke, native-owner, media-cleanup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ""
        run: |
          jq -e --arg skips "$ALLOWED_SKIPS" '
            ($skips | split(",") | map(select(. != ""))) as $allowed
            | length > 0 and all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and (.key | IN($allowed[]))))
          ' <<<"$NEEDS" >/dev/null || { echo "::error::ci-ok failed: $(jq -c 'map_values(.result)' <<<"$NEEDS")"; exit 1; }
  # Weekly backstop outside ci-ok: fails 14 days before published rates expire, so a stopped
  # pricing.yml schedule still leaves at least 7 days of notice.
  pricing-freshness:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'edbfi/siluet'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: package.json }
      # Stage each feed on its own, so one absent branch or file cannot hide the others.
      - name: Read the published feeds
        run: >-
          bash scripts/pricing/stage-feeds.sh "$RUNNER_TEMP/pricing-feeds"
          pricing-data:pricing/v2/poyo.json:poyo-v2.json
          pricing-data:pricing/v1/feed.json:poyo-v1.json
          pricing-data-toapis:pricing/v2/toapis.json:toapis.json
      - name: Check the published rates
        if: ${{ !cancelled() }}
        run: >-
          bun scripts/pricing/freshness.ts --fail-within-days 14
          --poyo-v2 "$RUNNER_TEMP/pricing-feeds/poyo-v2.json"
          --poyo-v1 "$RUNNER_TEMP/pricing-feeds/poyo-v1.json"
          --toapis "$RUNNER_TEMP/pricing-feeds/toapis.json"
  audit:
    if: github.event_name != 'pull_request'
    strategy: { fail-fast: false, matrix: { dir: ["."] } }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    defaults: { run: { working-directory: "${{ matrix.dir }}" } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: "${{ matrix.dir }}/package.json" }
      - run: bun audit --audit-level=high
